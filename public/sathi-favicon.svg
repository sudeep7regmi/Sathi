<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
    <defs>
      <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10B981"/>
        <stop offset="100%" stop-color="#047857"/>
      </linearGradient>
  
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow
          dx="2"
          dy="4"
          stdDeviation="4"
          flood-color="#0f172a"
          flood-opacity="0.15"
        />
      </filter>
    </defs>
  
    <g transform="translate(10,10)" filter="url(#shadow)">
  
      <!-- Dynamic Field / Pitch Ring -->
      <path
        d="M70 135
           C20 135 10 90 40 40
           C55 15 85 5 110 20"
        fill="none"
        stroke="url(#emeraldGrad)"
        stroke-width="12"
        stroke-linecap="round"
      />
  
      <!-- Motion Lines -->
      <path
        d="M20 120 C35 120 40 100 55 90"
        fill="none"
        stroke="#34D399"
        stroke-width="5"
        stroke-linecap="round"
      />
  
      <path
        d="M10 105 C25 105 30 85 45 75"
        fill="none"
        stroke="#10B981"
        stroke-width="4"
        stroke-linecap="round"
      />
  
      <!-- Futsal Ball -->
      <circle
        cx="85"
        cy="65"
        r="38"
        fill="url(#emeraldGrad)"
      />
  
      <!-- Ball Pattern -->
      <polygon
        points="85,42 98,52 93,68 77,68 72,52"
        fill="#FFFFFF"
        opacity="0.95"
      />
  
      <polygon
        points="85,42 85,27 98,34 98,52"
        fill="#047857"
        opacity="0.3"
      />
  
      <polygon
        points="98,52 113,57 108,72 93,68"
        fill="#047857"
        opacity="0.3"
      />
  
      <polygon
        points="77,68 62,72 57,57 72,52"
        fill="#047857"
        opacity="0.3"
      />
  
      <polygon
        points="93,68 98,83 85,93 77,68"
        fill="#047857"
        opacity="0.4"
      />
  
      <!-- Center Accent -->
      <circle
        cx="85"
        cy="65"
        r="8"
        fill="#0f172a"
      />
  
      <circle
        cx="85"
        cy="65"
        r="4"
        fill="#34D399"
      />
  
    </g>
  </svg>